services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_dados:/data/db]

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [postgres_dados:/var/lib/postgresql/data]

volumes:
  mongo_dados:
  postgres_dados: